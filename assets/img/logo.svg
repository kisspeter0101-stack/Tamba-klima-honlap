<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="Támba Klíma">
  <defs>
    <linearGradient id="cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd8ff"/>
      <stop offset="0.55" stop-color="#1e9be0"/>
      <stop offset="1" stop-color="#0b5cab"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd21e"/>
      <stop offset="0.55" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#f5561d"/>
    </linearGradient>
  </defs>
  <g font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="54" letter-spacing="1">
    <text x="6" y="60" fill="url(#cold)" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">TÁMBA</text>
    <text x="6" y="110" fill="url(#warm)" stroke="#ffffff" stroke-width="1.5" paint-order="stroke">KLÍMA</text>
  </g>
  <g transform="translate(360 20)">
    <!-- jég kristály -->
    <g stroke="url(#cold)" stroke-width="6" stroke-linecap="round">
      <line x1="34" y1="4" x2="34" y2="64"/>
      <line x1="8" y1="18" x2="60" y2="50"/>
      <line x1="60" y1="18" x2="8" y2="50"/>
    </g>
    <!-- láng -->
    <path transform="translate(70 6)" fill="url(#warm)" d="M40 0c6 14-6 20-6 32 0 8 6 14 6 22 10-2 20-12 20-26C60 40 44 34 40 0Z"/>
  </g>
</svg>
