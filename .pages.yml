# Pages CMS beállítás (https://pagescms.org) – Támba Klíma
# Csabi itt tudja kezelni az akciókat és az árlistát; mentéskor a változás
# commitként kerül a repóba, a Vercel pedig automatikusan újra kiteszi az oldalt.

media:
  input: assets/img/akcio
  output: /assets/img/akcio
  categories: [image]
  extensions: [jpg, jpeg, png, webp]

content:
  - name: akciok
    label: Akciók
    type: file
    path: assets/data/akciok.json
    format: json
    fields:
      - name: akciok
        label: Akciós plakátok
        type: object
        list: true
        description: "A sorrend számít: a főoldalon az ELSŐ 3 akció jelenik meg, az Akciók oldalon mind. Az akció törléséhez töröld a sort."
        fields:
          - name: kep
            label: Plakát (kép)
            type: image
            required: true
            description: "Lehetőleg álló vagy négyzetes plakát, legfeljebb ~1 MB (a Facebookról lementett kép megfelel)."
          - name: alt
            label: Kép leírása (az ár is szerepeljen benne)
            type: string
            required: true
            description: "Pl.: Midea Solstice klíma, 3,5 kW – alapszereléssel 280000 Ft. Ez látszik a keresőknek és a képernyőolvasóknak."

  - name: arak
    label: Árlista
    type: file
    path: assets/data/arak.json
    format: json
    fields:
      - name: sorok
        label: Árlista sorai
        type: object
        list: true
        description: "Az Árak oldal táblázata. A sorrend számít. Az alapszerelés és a karbantartás árát a főoldal és a GYIK is ebből veszi, tehát itt elég átírni. Ha új sort veszel fel, az csak az Árak oldalon jelenik meg."
        fields:
          - name: tetel
            label: Tétel
            description: "Az első két (Alapszerelés) és a Klímakarbantartás sor elejét ne írd át, mert a főoldal ár-kijelzése ezekről ismeri fel a sort."
            type: string
            required: true
          - name: ar
            label: Ár
            type: string
            required: true
            description: "Szövegként írd, pl.: 80 000 Ft-tól, 12 000 Ft / méter, Egyedi megállapodás szerint"

  - name: referenciak
    label: Referenciák (fotók)
    type: file
    path: assets/data/referenciak.json
    format: json
    fields:
      - name: kepek
        label: Referenciafotók
        type: object
        list: true
        description: "A Referenciák oldal galériája. A sorrend számít (a lista elején lévő képek látszanak elöl). Új fotó: Add an entry, majd töltsd fel a képet és add meg a feliratot. Törléshez töröld a sort."
        fields:
          - name: kep
            label: Fotó
            type: image
            required: true
            description: "Csak saját, elvégzett munkáról készült valódi fotó. Mesterséges (AI) képet, másik cég munkáját vagy ugyanannak a munkának ugyanazt a képét kétszer ne tölts fel. A képen ne látszódjon arc, rendszám vagy házszám. A nagy képeket a rendszer automatikusan kicsinyíti."
          - name: alt
            label: Kép leírása (kereséshez, képernyőolvasóhoz)
            type: string
            required: true
            description: "Egy mondat arról, mi látszik a képen. Pl.: Midea beltéri egység krémszínű falon, otthonos szobában"
          - name: felirat
            label: Képaláírás (a kép alatt látszik)
            type: string
            description: "Rövid felirat, pl.: Beltéri egység – nappali"
          - name: foldal
            label: Látszódjon a főoldalon is
            type: boolean
            default: false
            description: "A főoldalon csak a bejelölt képek látszanak, legfeljebb 4–6 ajánlott."

  - name: velemenyek
    label: Vélemények
    type: file
    path: assets/data/velemenyek.json
    format: json
    fields:
      - name: velemenyek
        label: Ügyfélvélemények
        type: object
        list: true
        description: "A Vélemények oldal tartalma. Csak valódi, a Google-profilunkon vagy a Facebook-oldalunkon megjelent véleményeket tegyünk ki, szó szerint másolva, kitalált vagy átírt vélemény nem kerülhet fel."
        fields:
          - name: nev
            label: Név (rövidítve)
            type: string
            required: true
            description: "A vélemény írójának neve rövidítve, pl.: Kata M."
          - name: szoveg
            label: A vélemény szövege
            type: text
            required: true
            description: "Szó szerint másold be. Az idézőjelet nem kell kitenni, az oldal magától megteszi."
          - name: forras
            label: Forrás
            type: string
            default: Google
            description: "Honnan származik a vélemény: Google vagy Facebook."
          - name: foldal
            label: Látszódjon a főoldalon is
            type: boolean
            default: false
            description: "A főoldalon csak a bejelölt vélemények látszanak, ajánlott legfeljebb 4."
